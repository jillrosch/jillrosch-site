<script>
    if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
    }
    window.addEventListener('load', function () {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    });
    window.addEventListener('DOMContentLoaded', function () {
        if (window.scrollY > 0) window.scrollTo(0, 0);
        setTimeout(() => document.body.classList.add('ready'), 100);
    });

    (function scrollEngine() {
        let ticking = false;
        const subs = [];
        function onScroll() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(() => {
                    const scrollY = window.scrollY || window.pageYOffset;
                    const vh = window.innerHeight;
                    subs.forEach(fn => { try { fn(scrollY, vh); } catch(e){} });
                    ticking = false;
                });
            }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        window.__scrollEngine = { subscribe: fn => subs.push(fn), kick: onScroll };
        onScroll();
    })();

    function getProgress(el, scrollY, vh) {
        const rect = el.getBoundingClientRect();
        const total = vh + rect.height;
        const seen = vh - rect.top;
        return Math.max(0, Math.min(1, seen / total));
    }

    setTimeout(function() {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }, 1800);

    (function preloadImages() {
        const imgUrls = [
            'https://i.picrd.com/images/KTAynODkFPc.webp',
            'https://i.picrd.com/images/Ap9Nq0HQhFx.webp',
            'https://i.picrd.com/images/pKxUK7OigHa.webp',
            'https://i.picrd.com/images/FFdSIh2iioL.webp',
            'https://i.picrd.com/images/XmXjFUclVaZ.webp',
            'https://i.picrd.com/images/XOe58D7DQ9p.webp',
            'https://i.picrd.com/images/usqRFiHi4dn.webp'
        ];
        imgUrls.forEach(url => { const img = new Image(); img.src = url; });
    })();

    document.addEventListener('DOMContentLoaded', function() {
        const btnLearn = document.getElementById('btnLearn');
        if (btnLearn) {
            btnLearn.addEventListener('click', function() {
                const target = document.getElementById('howTypingWrapper') || document.getElementById('howItWorks');
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        }
    });

    (function initNav() {
        const allNavItems = document.querySelectorAll('.nav-item, .mobile-nav-dock a');
        if (!allNavItems.length) return;

        allNavItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = item.dataset.target;
                if (!targetId) return;
                const target = document.getElementById(targetId);
                if (!target) return;
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setActive(targetId);
            });
        });

        function setActive(targetId) {
            allNavItems.forEach(el => {
                el.classList.toggle('active', el.dataset.target === targetId);
            });
        }

        const sections = [
            { id: 'heroTop', el: document.getElementById('heroTop') },
            { id: 'projectsShowcase', el: document.getElementById('projectsShowcase') },
            { id: 'aboutSection', el: document.getElementById('aboutSection') }
        ].filter(s => s.el);

        if (!sections.length) return;

        if (window.__scrollEngine) {
            window.__scrollEngine.subscribe((scrollY, vh) => {
                const focus = vh * 0.35;
                let best = sections[0];
                let bestDist = Infinity;

                sections.forEach(s => {
                    const rect = s.el.getBoundingClientRect();
                    const dist = Math.abs(rect.top - focus);
                    if (dist < bestDist) { bestDist = dist; best = s; }
                });

                if (scrollY < 80) best = sections[0];
                setActive(best.id);
            });
        }
    })();

    (function initCtaSlide() {
        const about = document.getElementById('aboutSection');
        if (!about) return;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) document.body.classList.add('about-active');
                else document.body.classList.remove('about-active');
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -30% 0px' });

        observer.observe(about);
    })();

    function watchReversible(elements, options) {
        const opts = Object.assign({
            threshold: 0.12,
            rootMargin: '0px 0px -40px 0px',
            stagger: 0,
            className: 'visible'
        }, options || {});

        if (!elements || !elements.length) return;
        const list = Array.from(elements);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const el = entry.target;
                if (entry.isIntersecting) {
                    const i = list.indexOf(el);
                    const delay = i >= 0 ? i * opts.stagger : 0;
                    setTimeout(() => el.classList.add(opts.className), delay);
                } else {
                    el.classList.remove(opts.className);
                }
            });
        }, { threshold: opts.threshold, rootMargin: opts.rootMargin });

        list.forEach(el => observer.observe(el));
    }

    /* Helper: run callback once when element enters viewport */
    function onEnterViewport(el, callback, options) {
        if (!el) return;
        const opts = Object.assign({
            threshold: 0.25,
            rootMargin: '0px 0px -80px 0px',
            once: true
        }, options || {});

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    callback();
                    if (opts.once) observer.disconnect();
                }
            });
        }, { threshold: opts.threshold, rootMargin: opts.rootMargin });

        observer.observe(el);
    }

    /* =====================================================
       HERO TYPING (always runs on load)
       ===================================================== */
    document.addEventListener('DOMContentLoaded', function() {
        const cursor = document.getElementById('typingCursor');
        const subheadline = document.getElementById('subheadline');
        const learnMore = document.getElementById('learnMore');

        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
        const line3 = document.getElementById('line3');

        const lines = [{
            element: line1,
            parts: [
                { text: '01', style: 'num', isGradient: true },
                { text: '  ', style: '' },
                { text: '<Hello, I\'m ', style: 'tag' },
                { text: 'Jill!', style: 'highlight-blue' },
                { text: '>', style: 'tag-closing' }
            ]
        }, {
            element: line2,
            parts: [
                { text: '02', style: 'num' },
                { text: '  ', style: '' },
                { text: '<I ', style: 'tag' },
                { text: 'design ', style: 'highlight-blue' },
                { text: ', and ', style: 'tag' },
                { text: 'develop', style: 'highlight-blue' }
            ]
        }, {
            element: line3,
            parts: [
                { text: '03', style: 'num' },
                { text: '  ', style: '' },
                { text: 'websites.', style: 'highlight-blue' },
                { text: '>', style: 'tag-closing' }
            ]
        }];

        let allChars = [];
        lines.forEach(line => {
            line.parts.forEach(part => {
                if (part.text) {
                    for (let i = 0; i < part.text.length; i++) {
                        allChars.push({
                            char: part.text[i],
                            style: part.style,
                            lineElement: line.element,
                            isGradient: part.isGradient || false
                        });
                    }
                }
            });
        });

        let index = 0;
        const typingSpeed = 45;

        lines.forEach(line => {
            const container = document.createElement('span');
            container.className = 'line-content';
            line.element.appendChild(container);
        });

        function typeNextChar() {
            if (index < allChars.length) {
                const charData = allChars[index];

                if (charData.isGradient && charData.char === '0') {
                    const container = charData.lineElement.querySelector('.line-content');
                    if (container) {
                        const wrapper = document.createElement('span');
                        wrapper.className = 'gradient-wrap';
                        const box = document.createElement('span');
                        box.className = 'gradient-box';
                        wrapper.appendChild(box);
                        const numSpan = document.createElement('span');
                        numSpan.className = 'num';
                        numSpan.textContent = '01';
                        numSpan.style.opacity = '0';
                        numSpan.style.transition = 'opacity 0.05s ease';
                        wrapper.appendChild(numSpan);
                        container.appendChild(wrapper);
                        requestAnimationFrame(() => { numSpan.style.opacity = '1'; });
                    }
                    index += 2;
                    setTimeout(typeNextChar, typingSpeed);
                    return;
                }

                const span = document.createElement('span');
                span.textContent = charData.char;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.05s ease';

                if (charData.style === 'num') span.className = 'num';
                else if (charData.style === 'tag') { span.style.color = '#2e3d5a'; span.style.fontWeight = '500'; }
                else if (charData.style === 'highlight-blue') { span.style.color = '#1d4ed8'; span.style.fontWeight = '700'; }
                else if (charData.style === 'tag-closing') { span.style.color = '#2e3d5a'; span.style.fontWeight = '500'; }

                const container = charData.lineElement.querySelector('.line-content');
                if (container) container.appendChild(span);

                requestAnimationFrame(() => { span.style.opacity = '1'; });
                index++;
                setTimeout(typeNextChar, typingSpeed);
            } else {
                setTimeout(() => {
                    cursor.style.opacity = '0';
                    cursor.style.transition = 'opacity 0.3s ease';
                }, 400);

                setTimeout(() => { subheadline.classList.add('visible'); }, 200);
                setTimeout(() => { learnMore.classList.add('visible'); }, 400);
            }
        }

        setTimeout(typeNextChar, 1200);
    });

    /* =====================================================
       HOW IT WORKS (01 / 02) — scroll-triggered
       ===================================================== */
    let howTypingStarted = false;
    function startHowItWorksTyping() {
        if (howTypingStarted) return;
        howTypingStarted = true;

        const howWrapper = document.getElementById('howTypingWrapper');
        howWrapper.classList.add('visible');

        const howCursor = document.getElementById('howTypingCursor');
        const howLine1 = document.getElementById('howLine1');
        const howLine2 = document.getElementById('howLine2');

        const howLines = [{
            element: howLine1,
            parts: [
                { text: '01', style: 'how-line-number', isGradient: true },
                { text: '  ', style: '' },
                { text: 'First, we need an', style: 'how-tag' }
            ]
        }, {
            element: howLine2,
            parts: [
                { text: '02', style: 'how-line-number' },
                { text: '  ', style: '' },
                { text: 'idea...', style: 'how-text-blue' }
            ]
        }];

        let allHowChars = [];
        howLines.forEach(line => {
            line.parts.forEach(part => {
                if (part.text) {
                    for (let i = 0; i < part.text.length; i++) {
                        allHowChars.push({
                            char: part.text[i],
                            style: part.style,
                            lineElement: line.element,
                            isGradient: part.isGradient || false
                        });
                    }
                }
            });
        });

        let howIndex = 0;
        const howSpeed = 40;

        howLines.forEach(line => {
            const container = document.createElement('span');
            container.className = 'how-line-content';
            while (line.element.firstChild) line.element.removeChild(line.element.firstChild);
            line.element.appendChild(container);
        });

        function typeHowNextChar() {
            if (howIndex < allHowChars.length) {
                const charData = allHowChars[howIndex];

                if (charData.isGradient && charData.char === '0') {
                    const container = charData.lineElement.querySelector('.how-line-content');
                    if (container) {
                        const wrapper = document.createElement('span');
                        wrapper.className = 'gradient-wrap';
                        const box = document.createElement('span');
                        box.className = 'gradient-box';
                        wrapper.appendChild(box);
                        const numSpan = document.createElement('span');
                        numSpan.className = 'num';
                        numSpan.textContent = '01';
                        numSpan.style.opacity = '0';
                        numSpan.style.transition = 'opacity 0.05s ease';
                        wrapper.appendChild(numSpan);
                        container.appendChild(wrapper);
                        requestAnimationFrame(() => { numSpan.style.opacity = '1'; });
                    }
                    howIndex += 2;
                    setTimeout(typeHowNextChar, howSpeed);
                    return;
                }

                const span = document.createElement('span');
                span.textContent = charData.char;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.05s ease';

                if (charData.style === 'how-line-number') span.className = 'num';
                else if (charData.style === 'how-tag') { span.style.color = '#2e3d5a'; span.style.fontWeight = '500'; }
                else if (charData.style === 'how-text-blue') { span.style.color = '#1d4ed8'; span.style.fontWeight = '600'; }

                const container = charData.lineElement.querySelector('.how-line-content');
                if (container) container.appendChild(span);
                requestAnimationFrame(() => { span.style.opacity = '1'; });

                howIndex++;
                setTimeout(typeHowNextChar, howSpeed);
            } else {
                // ✅ 01/02 finished → hide cursor → start bubbles
                setTimeout(() => {
                    howCursor.style.opacity = '0';
                    howCursor.style.transition = 'opacity 0.3s ease';
                }, 300);
                setTimeout(showMessengerConvo, 400);
            }
        }

        setTimeout(typeHowNextChar, 300);
    }

    /* =====================================================
       MESSENGER — sequential bubbles
       When the LAST bubble appears → start 03/04 typing
       ===================================================== */
    let messengerShown = false;
    function showMessengerConvo() {
        if (messengerShown) return;
        messengerShown = true;

        const convo = document.getElementById('messengerConvo');
        const messages = [
            { side: 'left', name: '', text: 'I need a website for my cosmetics brand, <strong>NINTH AVENUE</strong>.<br>We specialize in clean, cruelty-free beauty products made for every skin tone.' },
            { side: 'right', name: 'Jill', text: 'Alright, great!<br>I\'ll handle everything, first the design that I\'ll share with you. Once validated, I\'ll develop your website and put it online with a <strong>product catalog</strong>!' },
            { side: 'left', name: '', text: 'Perfect, when do we start <span class="emoji">:)</span>?' }
        ];

        const msgElements = [];
        messages.forEach((msg) => {
            const row = document.createElement('div');
            row.className = `msg-row ${msg.side}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            if (msg.side === 'left') avatar.innerHTML = `<div class="fallback-avatar">👤</div>`;
            else avatar.innerHTML = `<img src="https://imgh.in/host/ucslog" alt="Jill Rösch" onerror="this.innerHTML='<div class=\\'fallback-avatar\\'>🧑🏻</div>'">`;

            const bubbleWrapper = document.createElement('div');
            bubbleWrapper.className = 'msg-bubble-wrapper';

            if (msg.name) {
                const nameTag = document.createElement('span');
                nameTag.className = 'msg-name';
                nameTag.textContent = msg.name;
                bubbleWrapper.appendChild(nameTag);
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = msg.text;
            bubbleWrapper.appendChild(bubble);

            row.appendChild(avatar);
            row.appendChild(bubbleWrapper);
            convo.appendChild(row);
            msgElements.push(row);
        });

        const REVEAL_DELAY = 1100;
        const lastIndex = msgElements.length - 1;

        msgElements.forEach((el, i) => {
            setTimeout(() => {
                el.classList.add('visible');

                // ✅ Last bubble appears → start 03/04 typing at the same moment
                if (i === lastIndex) {
                    startNowTyping();
                }
            }, i * REVEAL_DELAY);
        });
    }

    /* =====================================================
       NOW (03 / 04) — triggered by last bubble
       ===================================================== */
    let nowTypingStarted = false;
    function startNowTyping() {
        if (nowTypingStarted) return;
        nowTypingStarted = true;

        document.getElementById('nowSectionWrapper').classList.add('visible');

        const nowCursor = document.getElementById('nowTypingCursor');
        const nowLine1 = document.getElementById('nowLine1');
        const nowLine2 = document.getElementById('nowLine2');

        const line1Container = nowLine1.querySelector('.now-line-content');
        const line2Container = nowLine2.querySelector('.now-line-content');
        if (line1Container) line1Container.innerHTML = '';
        if (line2Container) line2Container.innerHTML = '';

        const nowParts = [
            { element: nowLine1, text: '03 Then an analysis', isGradient: true },
            { element: nowLine2, text: '04 and a direction...', isGradient: false }
        ];

        let allNowChars = [];
        nowParts.forEach(part => {
            const text = part.text;
            for (let i = 0; i < text.length; i++) {
                allNowChars.push({
                    char: text[i],
                    element: part.element,
                    isGradient: part.isGradient && i === 0 && text.substring(0, 2) === '03'
                });
            }
        });

        const nowSpeed = 40;
        let currentIndex = 0;

        function typeNowChar() {
            if (currentIndex < allNowChars.length) {
                const charData = allNowChars[currentIndex];
                const container = charData.element.querySelector('.now-line-content');

                if (charData.isGradient && charData.char === '0') {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'gradient-wrap';
                    const box = document.createElement('span');
                    box.className = 'gradient-box';
                    wrapper.appendChild(box);
                    const numSpan = document.createElement('span');
                    numSpan.className = 'num';
                    numSpan.textContent = '03';
                    numSpan.style.opacity = '0';
                    numSpan.style.transition = 'opacity 0.05s ease';
                    wrapper.appendChild(numSpan);
                    if (container) {
                        container.appendChild(wrapper);
                        requestAnimationFrame(() => { numSpan.style.opacity = '1'; });
                    }
                    currentIndex += 2;
                    setTimeout(typeNowChar, nowSpeed);
                    return;
                }

                const span = document.createElement('span');
                span.textContent = charData.char;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.05s ease';

                const containerText = container ? container.textContent : '';
                if (charData.char >= '0' && charData.char <= '9' && containerText.length < 3) span.className = 'num';
                else if (charData.element === nowLine1) { span.style.color = '#2e3d5a'; span.style.fontWeight = '500'; }
                else if (charData.element === nowLine2) { span.style.color = '#1d4ed8'; span.style.fontWeight = '600'; }

                if (container) container.appendChild(span);
                requestAnimationFrame(() => { span.style.opacity = '1'; });
                currentIndex++;
                setTimeout(typeNowChar, nowSpeed);
            } else {
                setTimeout(() => {
                    nowCursor.style.opacity = '0';
                    nowCursor.style.transition = 'opacity 0.3s ease';
                }, 300);
                setTimeout(() => { document.getElementById('nowArrowDown').classList.add('visible'); }, 400);
                setTimeout(() => { showMarketAnalysis(); }, 700);
            }
        }
        setTimeout(typeNowChar, 300);
    }

    function showMarketAnalysis() {
        const marketSection = document.getElementById('marketAnalysis');
        marketSection.classList.add('visible');
        watchReversible(marketSection.querySelectorAll('.market-column'), { stagger: 120 });
        setTimeout(() => { startDesignTyping(); }, 800);
    }

    /* =====================================================
       DESIGN (05 / 06)
       ===================================================== */
    let designTypingStarted = false;
    function startDesignTyping() {
        if (designTypingStarted) return;
        designTypingStarted = true;

        document.getElementById('designSection').classList.add('visible');

        const designCursor = document.getElementById('designTypingCursor');
        const designLine1 = document.getElementById('designLine1');
        const designLine2 = document.getElementById('designLine2');

        const line1Container = designLine1.querySelector('.design-line-content');
        const line2Container = designLine2.querySelector('.design-line-content');
        if (line1Container) line1Container.innerHTML = '';
        if (line2Container) line2Container.innerHTML = '';

        const designParts = [
            { element: designLine1, text: '05 Creativity takes place', isGradient: true },
            { element: designLine2, text: '06 for the design.', isGradient: false }
        ];

        let allDesignChars = [];
        designParts.forEach(part => {
            const text = part.text;
            for (let i = 0; i < text.length; i++) {
                allDesignChars.push({
                    char: text[i],
                    element: part.element,
                    isGradient: part.isGradient && i === 0 && text.substring(0, 2) === '05'
                });
            }
        });

        const designSpeed = 40;
        let currentIndex = 0;

        function typeDesignChar() {
            if (currentIndex < allDesignChars.length) {
                const charData = allDesignChars[currentIndex];
                const container = charData.element.querySelector('.design-line-content');

                if (charData.isGradient && charData.char === '0') {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'gradient-wrap';
                    const box = document.createElement('span');
                    box.className = 'gradient-box';
                    wrapper.appendChild(box);
                    const numSpan = document.createElement('span');
                    numSpan.className = 'num';
                    numSpan.textContent = '05';
                    numSpan.style.opacity = '0';
                    numSpan.style.transition = 'opacity 0.05s ease';
                    wrapper.appendChild(numSpan);
                    if (container) {
                        container.appendChild(wrapper);
                        requestAnimationFrame(() => { numSpan.style.opacity = '1'; });
                    }
                    currentIndex += 2;
                    setTimeout(typeDesignChar, designSpeed);
                    return;
                }

                const span = document.createElement('span');
                span.textContent = charData.char;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.05s ease';

                const containerText = container ? container.textContent : '';
                if (charData.char >= '0' && charData.char <= '9' && containerText.length < 3) span.className = 'num';
                else if (charData.element === designLine1) { span.style.color = '#2e3d5a'; span.style.fontWeight = '500'; }
                else if (charData.element === designLine2) { span.style.color = '#1d4ed8'; span.style.fontWeight = '600'; }

                if (container) container.appendChild(span);
                requestAnimationFrame(() => { span.style.opacity = '1'; });
                currentIndex++;
                setTimeout(typeDesignChar, designSpeed);
            } else {
                setTimeout(() => {
                    designCursor.style.opacity = '0';
                    designCursor.style.transition = 'opacity 0.3s ease';
                }, 300);
                setTimeout(() => { showHighlightSection(); }, 500);
            }
        }
        setTimeout(typeDesignChar, 300);
    }

    function showHighlightSection() {
        const highlightSection = document.getElementById('highlightSection');
        highlightSection.classList.add('visible');

        const imgWrapper1 = document.getElementById('imgWrapper1');
        const imgWrapper2 = document.getElementById('imgWrapper2');
        const img1 = document.getElementById('highlightImg1');
        const img2 = document.getElementById('highlightImg2');
        const col2 = document.getElementById('highlightCol2');

        const imgObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        imgWrapper1.classList.add('visible');
                        setTimeout(() => { img1.classList.add('float'); }, 500);
                    }, 50);
                    setTimeout(() => {
                        imgWrapper2.classList.add('visible');
                        setTimeout(() => { img2.classList.add('float'); }, 500);
                    }, 250);
                } else {
                    imgWrapper1.classList.remove('visible');
                    imgWrapper2.classList.remove('visible');
                    img1.classList.remove('float');
                    img2.classList.remove('float');
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -50px 0px' });

        imgObserver.observe(highlightSection);

        watchReversible(document.querySelectorAll('.highlight-text-item'), { stagger: 120 });
        watchReversible([col2], { threshold: 0.1 });

        if (window.__scrollEngine) {
            window.__scrollEngine.subscribe((scrollY, vh) => {
                const rect = highlightSection.getBoundingClientRect();
                if (rect.bottom < -300 || rect.top > vh + 300) return;

                const p = getProgress(highlightSection, scrollY, vh);
                const centered = (p - 0.5) * 2;

                const images = [
                    { el: img1, dir: 1, rotDir: -1 },
                    { el: img2, dir: -1, rotDir: 1 }
                ];

                images.forEach(({ el, dir, rotDir }) => {
                    if (!el || !el.classList.contains('float')) return;
                    const ty = centered * -30 * dir;
                    const tx = centered * 12 * dir;
                    const rot = centered * 3.5 * rotDir;
                    const scale = 1.01 + Math.abs(centered) * 0.03;
                    el.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rot}deg) scale(${scale})`;
                });
            });
        }

        setTimeout(() => { startFinalTyping(); }, 900);
    }

    /* =====================================================
       FINAL (07 / 08)
       ===================================================== */
    let finalTypingStarted = false;
    function startFinalTyping() {
        if (finalTypingStarted) return;
        finalTypingStarted = true;

        document.getElementById('finalSection').classList.add('visible');

        const finalCursor = document.getElementById('finalTypingCursor');
        const finalLine1 = document.getElementById('finalLine1');
        const finalLine2 = document.getElementById('finalLine2');

        const line1Container = finalLine1.querySelector('.final-line-content');
        const line2Container = finalLine2.querySelector('.final-line-content');
        if (line1Container) line1Container.innerHTML = '';
        if (line2Container) line2Container.innerHTML = '';

        const finalParts = [
            { element: finalLine1, text: '07 Finally, I code and', isGradient: true },
            { element: finalLine2, text: '08 I publish your website!', isGradient: false }
        ];

        let allFinalChars = [];
        finalParts.forEach(part => {
            const text = part.text;
            for (let i = 0; i < text.length; i++) {
                allFinalChars.push({
                    char: text[i],
                    element: part.element,
                    isGradient: part.isGradient && i === 0 && text.substring(0, 2) === '07'
                });
            }
        });

        const finalSpeed = 40;
        let currentIndex = 0;

        function typeFinalChar() {
            if (currentIndex < allFinalChars.length) {
                const charData = allFinalChars[currentIndex];
                const container = charData.element.querySelector('.final-line-content');

                if (charData.isGradient && charData.char === '0') {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'gradient-wrap';
                    const box = document.createElement('span');
                    box.className = 'gradient-box';
                    wrapper.appendChild(box);
                    const numSpan = document.createElement('span');
                    numSpan.className = 'num';
                    numSpan.textContent = '07';
                    numSpan.style.opacity = '0';
                    numSpan.style.transition = 'opacity 0.05s ease';
                    wrapper.appendChild(numSpan);
                    if (container) {
                        container.appendChild(wrapper);
                        requestAnimationFrame(() => { numSpan.style.opacity = '1'; });
                    }
                    currentIndex += 2;
                    setTimeout(typeFinalChar, finalSpeed);
                    return;
                }

                const span = document.createElement('span');
                span.textContent = charData.char;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.05s ease';

                const containerText = container ? container.textContent : '';
                if (charData.char >= '0' && charData.char <= '9' && containerText.length < 3) span.className = 'num';
                else if (charData.element === finalLine1) { span.style.color = '#2e3d5a'; span.style.fontWeight = '500'; }
                else if (charData.element === finalLine2) { span.style.color = '#1d4ed8'; span.style.fontWeight = '600'; }

                if (container) container.appendChild(span);
                requestAnimationFrame(() => { span.style.opacity = '1'; });
                currentIndex++;
                setTimeout(typeFinalChar, finalSpeed);
            } else {
                setTimeout(() => {
                    finalCursor.style.opacity = '0';
                    finalCursor.style.transition = 'opacity 0.3s ease';
                }, 300);
                revealFinalImages();
                setTimeout(() => { startWonderingTyping(); }, 900);
            }
        }
        setTimeout(typeFinalChar, 300);
    }

    function revealFinalImages() {
        const finalImages = document.getElementById('finalImages');
        if (!finalImages) return;

        const items = finalImages.querySelectorAll('.final-img-item');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    items.forEach((item, i) => {
                        setTimeout(() => { item.classList.add('visible'); }, i * 120);
                    });
                    setTimeout(() => {
                        items.forEach((item, i) => {
                            setTimeout(() => item.classList.add('float'), i * 150);
                        });
                    }, 700);
                } else {
                    items.forEach((item) => {
                        item.classList.remove('visible');
                        item.classList.remove('float');
                    });
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

        observer.observe(finalImages);

        if (window.__scrollEngine) {
            window.__scrollEngine.subscribe((scrollY, vh) => {
                const rect = finalImages.getBoundingClientRect();
                if (rect.bottom < -300 || rect.top > vh + 300) return;

                const p = getProgress(finalImages, scrollY, vh);
                const centered = (p - 0.5) * 2;

                items.forEach((item, i) => {
                    if (!item.classList.contains('visible')) return;
                    if (!item.classList.contains('float')) {
                        const dir = i === 0 ? 1 : -1;
                        const tx = centered * 8 * dir;
                        const rotY = centered * 4 * dir;
                        item.style.transform = `translate3d(${tx}px, 0, 0) perspective(1200px) rotateY(${rotY}deg)`;
                    }
                });
            });
        }
    }

    /* =====================================================
       SCROLL-TRIGGER BINDING
       Only 01/02 is scroll-gated.

              05/06 → highlight → 07/08 → final → 09/10 → FAQ
       ===================================================== */

    (function initProjectsCarousel() {
        const section = document.getElementById('projectsShowcase');
        if (!section) return;

        const track = document.getElementById('carouselTrack');
        const tiles = Array.from(track.querySelectorAll('.project-tile'));
        const prevBtn = document.getElementById('carouselPrev');
        const nextBtn = document.getElementById('carouselNext');

        const FLIP_INTERVAL = 3200;
        const STAGGER = 700;

        tiles.forEach((tile, i) => {
            tile.classList.remove('show-name');
            const startDelay = i * STAGGER;
            setTimeout(() => {
                tile.classList.add('show-name');
                setInterval(() => {
                    if (!tile.matches(':hover')) tile.classList.toggle('show-name');
                }, FLIP_INTERVAL);
            }, startDelay + FLIP_INTERVAL);
        });

        tiles.forEach(tile => {
            tile.addEventListener('mouseenter', () => {
                tile.classList.remove('show-name');
            });
        });

        const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) section.classList.add('visible');
                else section.classList.remove('visible');
            });
        }, { threshold: 0.05 });
        sectionObserver.observe(section);

        let index = 0;

        function getStep() {
            if (!tiles.length) return 0;
            const tile = tiles[0];
            const tileWidth = tile.getBoundingClientRect().width;
            const gap = parseFloat(getComputedStyle(track).gap) || 0;
            return tileWidth + gap;
        }

        function visibleCount() {
            const vp = track.parentElement.getBoundingClientRect().width;
            const step = getStep();
            if (!step) return 1;
            return Math.max(1, Math.floor(vp / step));
        }

        function maxIndex() {
            return Math.max(0, tiles.length - visibleCount());
        }

        function update() {
            const step = getStep();
            track.style.transform = `translateX(-${index * step}px)`;
            prevBtn.disabled = index <= 0;
            nextBtn.disabled = index >= maxIndex();
        }

        prevBtn.addEventListener('click', () => {
            index = Math.max(0, index - 1);
            update();
        });
        nextBtn.addEventListener('click', () => {
            index = Math.min(maxIndex(), index + 1);
            update();
        });

        window.addEventListener('resize', () => {
            index = Math.min(index, maxIndex());
            update();
        });

        update();
    })();

                    });
                } else {
                    section.classList.remove('visible');
                    cards.forEach((card) => card.classList.remove('visible'));
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        sectionObserver.observe(section);
    })();

    document.addEventListener('DOMContentLoaded', function() {
        const slides = document.querySelectorAll('.laptop-slide');
        const dots = document.querySelectorAll('.dot');
        if (!slides.length) return;

        let currentSlide = 0;
        let slideInterval;

        function goToSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            currentSlide = index;
        }

        function nextSlide() {
            const next = (currentSlide + 1) % slides.length;
            goToSlide(next);
        }

        dots.forEach((dot, index) => {
            dot.addEventListener('click', function() {
                clearInterval(slideInterval);
                goToSlide(index);
                slideInterval = setInterval(nextSlide, 3000);
            });
        });

        slideInterval = setInterval(nextSlide, 3000);
    });

    window.addEventListener('load', () => { if (window.__scrollEngine) window.__scrollEngine.kick(); });

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            if (window.__scrollEngine) window.__scrollEngine.kick();
            window.dispatchEvent(new Event('carousel-recalc'));
        }, 150);
    });

    (function initScrollIndicator() {
        const btn = document.querySelector('.scroll-indicator');
        if (!btn) return;
        const icon = btn.querySelector('i');
        if (!icon) return;

        function updateState() {
            const scrollY = window.scrollY || window.pageYOffset;
            const atBottom = (scrollY + window.innerHeight) >= (document.documentElement.scrollHeight - 4);

            if (atBottom) {
                icon.classList.remove('fa-arrow-down');
                icon.classList.add('fa-arrow-up');
                btn.dataset.dir = 'up';
            } else {
                icon.classList.remove('fa-arrow-up');
                icon.classList.add('fa-arrow-down');
                btn.dataset.dir = 'down';
            }
        }

        btn.addEventListener('click', function () {
            const dir = btn.dataset.dir || 'down';
            if (dir === 'up') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
            }
        });

        if (window.__scrollEngine) {
            window.__scrollEngine.subscribe(updateState);
        } else {
            window.addEventListener('scroll', updateState, { passive: true });
            window.addEventListener('resize', updateState, { passive: true });
        }

        updateState();
    })();
